services:
  mem0-target:
    profiles: ["mem0-demo"]
    build:
      context: .
      dockerfile: mem0_target/Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MEM0_TELEMETRY: "false"
    volumes: [mem0_target_data:/data]
  reference-target:
    profiles: ["external-demo"]
    build: ./reference_target
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: [reference_target_data:/data]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memory_auditor
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
    # Database access stays inside the Compose network; avoid host-port conflicts.
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d memory_auditor"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    # The backend's research-contract tests resolve versioned local fixtures
    # from the repository root.  Mount them read-only for the development
    # container without copying datasets into its writable application volume.
    volumes: [./backend:/app, ./datasets:/datasets:ro, ./scripts:/scripts:ro, ./backend:/backend:ro]
    env_file: .env
    environment:
      MEM0_TARGET_URL: ${MEM0_TARGET_URL:-http://mem0-target:8011}
      PYTHONPATH: /app:/
      WATCHFILES_FORCE_POLLING: "true"
      AUDITOR_CODE_REVISION: ${AUDITOR_CODE_REVISION:-development}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    image: node:22.22.2-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes: [./frontend:/app]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
volumes: {postgres_data: {}, reference_target_data: {}, mem0_target_data: {}}
