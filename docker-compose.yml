services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memory_auditor
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d memory_auditor"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    volumes: [./backend:/app]
    env_file: .env
    environment:
      PYTHONPATH: /app
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    image: node:22.22.2-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes: [./frontend:/app]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {postgres_data: {}}
